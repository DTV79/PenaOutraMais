<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071a2d" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Premios y bote · Peña Outra Máis</title>
  <link rel="icon" href="/admin/icon-admin.png" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/admin/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Outra Máis Admin" />
  <link rel="manifest" href="/admin/manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css?v=20261023-13" />
  <link rel="stylesheet" href="css/forms.css?v=20261022-33" />
</head>
<body data-admin-page="premios">
  <div class="admin-fixed-shell">
  <div id="adminHeader"></div>
</div>
  <div class="admin-wrap"><main class="admin-main">
    <header class="admin-page-title"><p class="eyebrow">ECONOMÍA</p><h1>Premios y bote</h1><p>Resumen y movimientos económicos de la temporada activa.</p></header>
    <section id="awardsSummary" class="admin-kpis"></section>

    <nav class="draw-tabs award-tabs" aria-label="Secciones de premios">
      <button class="draw-tab active" type="button" data-award-tab="premios">
        <span>Premios</span>
      </button>
      <button class="draw-tab" type="button" data-award-tab="bote">
        <span>Bote</span>
      </button>
    </nav>

    <div class="award-tab-panels">
      <section class="draw-tab-panel active" data-award-panel="premios">
        <section class="admin-section">
          <div class="admin-section-head">
            <div><p class="eyebrow">PREMIOS</p><h2>Por meses</h2></div>
          </div>
          <div id="awardsMonthly" class="award-month-list"></div>
        </section>
      </section>

      <section class="draw-tab-panel" data-award-panel="bote">
        <section class="admin-section">
          <div class="admin-section-head">
            <div><p class="eyebrow">MOVIMIENTOS</p><h2>Bote</h2></div>
            <button class="admin-action" id="newBoteMovementButton" type="button">+ Movimiento</button>
          </div>
          <div id="awardsMovements" class="admin-loading">Cargando movimientos…</div>
        </section>
      </section>
    </div>
  </main></div>
  <script type="module" src="js/modules/premios/index.js?v=20261023-13"></script>
</body>
</html>
