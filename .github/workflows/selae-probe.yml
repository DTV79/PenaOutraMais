name: SELAE connectivity probe

on:
  push:
    paths:
      - ".github/workflows/selae-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SELAE
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.loteriasyapuestas.es/es/resultados"
          code="$(curl -L -A 'Mozilla/5.0' -sS -o /tmp/selae.html -w '%{http_code}' "$url")"
          echo "HTTP_STATUS=$code"
          echo "SIZE=$(wc -c < /tmp/selae.html)"
          head -c 500 /tmp/selae.html | tr '\n' ' '
          echo

# probe enabled
